[package]
name = "secular-nightreign-launcher"
version = "1.0.0"
edition = "2024"
description = "Native installer and launcher for Secular Nightreign"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5"
dirs = "6.0"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
hex = "0.4"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.37"
tempfile = "3.23"
tokio = { version = "1.48", features = ["rt", "time"] }
zip = { version = "6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
